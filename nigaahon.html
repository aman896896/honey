    <style>
        :root {
            --primary-color: #c084fc;
            --secondary-color: #3b0764;
            --accent-pink: #f472b6;
            --starlight-gold: #fde047;
            --bg-gradient-start: #0f051d;
            --bg-gradient-end: #030008;
            --text-color: #faf5ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: #000;
            height: 100vh;
            overflow: hidden;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            user-select: none;
        }

        /* Top Navigation */
        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 24px;
            background: linear-gradient(180deg, rgba(15, 5, 29, 0.85) 0%, rgba(0,0,0,0) 100%);
            z-index: 50;
            backdrop-filter: blur(5px);
        }

        .nav-logo {
            font-family: 'Dancing Script', cursive;
            font-size: 1.65rem;
            color: var(--starlight-gold);
            text-decoration: none;
            text-shadow: 0 0 12px rgba(192, 132, 252, 0.8);
        }

        .nav-links {
            display: flex;
            gap: 12px;
        }

        .nav-link {
            text-decoration: none;
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 6px 14px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
        }

        .nav-link:hover, .nav-link.active {
            background: linear-gradient(135deg, #a855f7, #ec4899);
            color: #fff;
            box-shadow: 0 0 15px rgba(192, 132, 252, 0.7);
            border-color: transparent;
        }

        /* Dynamic Cartoon Backgrounds */
        #bg-image-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            overflow: hidden;
        }

        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transform: scale(1.06);
            transition: opacity 1.8s cubic-bezier(0.4, 0, 0.2, 1), transform 9s ease-out;
            filter: brightness(0.42) contrast(1.15) saturate(1.15);
        }

        .bg-image.active {
            opacity: 1;
            transform: scale(1.0);
        }

        /* Particle Canvas */
        #particles-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* Ambient Orbs */
        .ambient-light {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw;
            height: 100vh;
            z-index: 3;
            pointer-events: none;
            overflow: hidden;
            mix-blend-mode: screen;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(95px);
            opacity: 0.32;
            animation: float 24s infinite ease-in-out alternate;
        }

        .orb-1 {
            width: 55vw; height: 55vw;
            background: var(--secondary-color);
            top: -15%; left: -15%;
        }

        .orb-2 {
            width: 45vw; height: 45vw;
            background: #701a75;
            bottom: -15%; right: -15%;
            animation-delay: -7s;
        }

        .orb-3 {
            width: 35vw; height: 35vw;
            background: #1e1b4b;
            top: 40%; left: 55%;
            opacity: 0.25;
            animation-delay: -14s;
        }

        @keyframes float {
            0% { transform: translateY(0) scale(1) rotate(0deg); }
            100% { transform: translateY(50px) scale(1.15) rotate(20deg); }
        }

        /* Main Container */
        #app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;

        /* Section Pill Badge */
        .section-badge {

            font-size: 0.82rem;
            letter-spacing: 3px;

            transform: translateY(-10px);
            transition: all 0.6s ease;
        }

        .section-badge.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Lyrics Container */
        .lyrics-container {
            position: relative;
            width: 100%;
            max-width: 950px;
            height: 380px;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
        }

        .lyrics-line {
            position: absolute;
            width: 100%;
            text-align: center;
            opacity: 0;
            transform: translateY(40px) scale(0.92);
            transition: opacity 0.9s cubic-bezier(0.2, 0.8, 0.2, 1),
                        transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1),
                        filter 0.9s ease;
            filter: blur(12px);
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
        }

        .lyrics-line.active {
            opacity: 1;
            transform: translateY(0) scale(1);
            filter: blur(0);
            z-index: 2;
        }

        .lyrics-line.exit {
            opacity: 0;
            transform: translateY(-40px) scale(1.06);
            filter: blur(8px);

        .lyrics-text {

            line-height: 1.38;

    <script>
        // Particle System: Anime Stars & Falling Sakura Petals
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let particlesArray = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        class AnimeParticle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = -20;
                this.size = Math.random() * 4 + 2;
                this.speedY = Math.random() * 1.2 + 0.5;
                this.speedX = Math.sin(Math.random() * Math.PI) * 0.8 + 0.3;
                this.angle = Math.random() * 360;
                this.spin = (Math.random() - 0.5) * 2;
                this.alpha = Math.random() * 0.6 + 0.3;
                // Alternates between Sakura Pink and Starlight Violet/Gold
                const type = Math.random();
                if (type < 0.5) {
                    this.color = '244, 114, 182'; // Pink petal
                    this.isPetal = true;
                } else if (type < 0.85) {
                    this.color = '192, 132, 252'; // Violet sparkle
                    this.isPetal = false;
                } else {
                    this.color = '253, 224, 71'; // Gold star
                    this.isPetal = false;
                }
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX + Math.sin(this.y * 0.02) * 0.5;
                this.angle += this.spin;
                if (this.y > canvas.height + 20 || this.x > canvas.width + 20) {
                    this.reset();
                }
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate((this.angle * Math.PI) / 180);
                ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
                ctx.shadowBlur = 10;
                ctx.shadowColor = `rgba(${this.color}, 0.8)`;

                if (this.isPetal) {
                    // Draw delicate petal shape
                    ctx.beginPath();
                    ctx.ellipse(0, 0, this.size, this.size * 1.8, 0, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    // Draw sparkling star
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size * 0.7, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        function initParticles() {
            particlesArray = [];
            const count = Math.floor((canvas.width * canvas.height) / 14000) + 25;
            for (let i = 0; i < count; i++) {
                const p = new AnimeParticle();
                p.y = Math.random() * canvas.height;
                particlesArray.push(p);
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            requestAnimationFrame(animateParticles);
        }
        initParticles();
        animateParticles();

        document.addEventListener('DOMContentLoaded', () => {
            const startBtn = document.getElementById('start-btn');
            const overlay = document.getElementById('start-overlay');
            const audio = document.getElementById('bg-music');
            const lyricsWrapper = document.getElementById('lyrics-wrapper');

            const forwardBtn = document.getElementById('forward-btn');
            const sectionBadge = document.getElementById('section-badge');

            let currentIndex = -1;

            // Inject Lyrics and 34 Unique Cartoon Images
            lyrics.forEach((line, index) => {
                // Text Element
                const el = document.createElement('div');
                el.classList.add('lyrics-line');
                
                let formattedText = '';
                if (line.text.includes('<div')) {
                    formattedText = line.text;
                } else {
                    const words = line.text.split(' ');
                    formattedText = words.map((word, i) => 
                        `<span class="lyrics-word" style="transition-delay: ${i * 0.12}s">${word}</span>`
                    ).join('');
                }

                el.innerHTML = `<div class="lyrics-text" id="text-container-${index}">${formattedText}</div>`;
                el.id = `line-${index}`;
                lyricsWrapper.appendChild(el);

                // Cartoon Image Element
                const imgEl = document.createElement('img');
                imgEl.src = `nigaahon_images/${line.image}`;
                imgEl.classList.add('bg-image');
                imgEl.id = `bg-${index}`;
                
                // Safe fallback to first cartoon image
                imgEl.onerror = function() {
                    this.src = 'nigaahon_images/img_01.jpg';
                };

                bgImageContainer.appendChild(imgEl);
            });

            function formatTime(seconds) {
                if (isNaN(seconds) || seconds < 0) return "00:00";
                const min = Math.floor(seconds / 60);
                const sec = Math.floor(seconds % 60);
                return `${min < 10 ? '0' + min : min}:${sec < 10 ? '0' + sec : sec}`;
            }

            function updateLyrics(currentTime) {
                let activeIdx = -1;
                for (let i = 0; i < lyrics.length; i++) {
                    if (currentTime >= lyrics[i].time) {
                        activeIdx = i;
                    } else {
                        break;
                    }
                }

                if (activeIdx !== currentIndex) {
                    if (currentIndex !== -1) {
                        const prevEl = document.getElementById(`line-${currentIndex}`);
                        if (prevEl) {
                            prevEl.classList.remove('active');
                            prevEl.classList.add('exit');
                        }
                        const prevImg = document.getElementById(`bg-${currentIndex}`);
                        if (prevImg) {
                            prevImg.classList.remove('active');
                        }
                    }

                    if (activeIdx !== -1) {
                        const nextEl = document.getElementById(`line-${activeIdx}`);
                        if (nextEl) {
                            nextEl.classList.remove('exit');
                            nextEl.classList.add('active');
                        }
                        const nextImg = document.getElementById(`bg-${activeIdx}`);
                        if (nextImg) {
                            nextImg.classList.add('active');
                        }
                        if (lyrics[activeIdx].section) {
                            sectionBadge.textContent = lyrics[activeIdx].section;
                            sectionBadge.classList.add('visible');
                        }
                    }

                    currentIndex = activeIdx;
                }
            }

            audio.addEventListener('timeupdate', () => {
                const cur = audio.currentTime;
                const dur = audio.duration || 169.5;

                updateLyrics(cur);

                const progress = (cur / dur) * 100;
                progressBar.style.width = `${progress}%`;
                currentTimeEl.textContent = formatTime(cur);
                totalTimeEl.textContent = formatTime(dur);
            });

            // Seek click
            progressContainer.addEventListener('click', (e) => {
                const rect = progressContainer.getBoundingClientRect();
                const pos = (e.clientX - rect.left) / rect.width;
                const dur = audio.duration || 169.5;
                audio.currentTime = pos * dur;
            });

            // Play / Pause
            function togglePlay() {
                if (audio.paused) {
                    audio.play();
                    playPauseBtn.textContent = '⏸';
                } else {
                    audio.pause();
                    playPauseBtn.textContent = '▶';
                }
            }
            playPauseBtn.addEventListener('click', togglePlay);

            rewindBtn.addEventListener('click', () => {
                audio.currentTime = Math.max(0, audio.currentTime - 10);
            });
            forwardBtn.addEventListener('click', () => {
                const dur = audio.duration || 169.5;
                audio.currentTime = Math.min(dur, audio.currentTime + 10);
            });

            // Keyboard shortcut
            window.addEventListener('keydown', (e) => {
                if (e.code === 'Space') {
                    e.preventDefault();
                    togglePlay();
                } else if (e.code === 'ArrowLeft') {
                    audio.currentTime = Math.max(0, audio.currentTime - 5);
                } else if (e.code === 'ArrowRight') {
                    const dur = audio.duration || 169.5;
                    audio.currentTime = Math.min(dur, audio.currentTime + 5);
                }
            });

            // Web Audio API dynamic beat visualizer
            let audioCtx, analyser, dataArray;
            let audioReactiveEnabled = false;

            startBtn.addEventListener('click', () => {
                if (!audioCtx) {
                    try {
                        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                        const audioSrc = audioCtx.createMediaElementSource(audio);
                        analyser = audioCtx.createAnalyser();
                        audioSrc.connect(analyser);
                        analyser.connect(audioCtx.destination);
                        analyser.fftSize = 256;
                        const bufferLength = analyser.frequencyBinCount;
                        dataArray = new Uint8Array(bufferLength);
                        audioReactiveEnabled = true;
                    } catch (err) {
                        console.warn('AudioContext not supported or restricted:', err);
                    }
                }

                audio.play().then(() => {
                    overlay.style.opacity = 0;
                    setTimeout(() => overlay.style.display = 'none', 800);
                    playPauseBtn.textContent = '⏸';
                }).catch(e => {
                    console.error("Audio playback error:", e);
                    alert("Please click or interact with the page to allow audio playback.");
                });
            });

            function audioLoop() {
                if (audioReactiveEnabled && currentIndex !== -1 && !audio.paused) {
                    analyser.getByteFrequencyData(dataArray);
                    
                    let sum = 0;
                    for (let i = 0; i < 28; i++) {
                        sum += dataArray[i];
                    }
                    const average = sum / 28;
                    
                    const scale = 1 + (average / 255) * 0.18;
                    const glow = (average / 255) * 50;

                    const activeTextContainer = document.getElementById(`text-container-${currentIndex}`);
                    if (activeTextContainer) {
                        activeTextContainer.style.transform = `scale(${scale})`;
                        activeTextContainer.style.textShadow = `0 0 ${glow + 12}px rgba(192, 132, 252, 0.95), 0 0 ${(glow/2) + 18}px rgba(244, 114, 182, 0.75)`;
                    }
                }
                requestAnimationFrame(audioLoop);
            }
            audioLoop();
        });
    </script>
</body>

</html>
