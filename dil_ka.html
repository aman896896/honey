    <style>
        :root {
            --primary-color: #ff3366;
            --secondary-color: #4a0e2e;
            --accent-color: #ffccd5;
            --gold-accent: #ffd166;
            --bg-gradient-start: #140308;
            --bg-gradient-end: #050002;
            --text-color: #fff0f3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: #000;
            height: 100vh;
            overflow: hidden;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            user-select: none;
        }

        /* Top Navigation */
        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 24px;
            background: linear-gradient(180deg, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0) 100%);
            z-index: 50;
            backdrop-filter: blur(4px);
        }

        .nav-logo {
            font-family: 'Dancing Script', cursive;
            font-size: 1.6rem;
            color: var(--accent-color);
            text-decoration: none;
            text-shadow: 0 0 10px rgba(255, 51, 102, 0.6);
        }

        .nav-links {
            display: flex;
            gap: 14px;
        }

        .nav-link {
            text-decoration: none;
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 6px 14px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
        }

        .nav-link:hover, .nav-link.active {
            background: var(--primary-color);
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 51, 102, 0.6);
            border-color: transparent;
        }

        /* Dynamic Background Images */
        #bg-image-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            overflow: hidden;
        }

        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transform: scale(1.06);
            transition: opacity 1.8s cubic-bezier(0.4, 0, 0.2, 1), transform 8s ease-out;
            filter: brightness(0.38) contrast(1.15) saturate(1.1);
        }

        .bg-image.active {
            opacity: 1;
            transform: scale(1.0);
        }

        /* Particle Canvas */
        #particles-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* Ambient Orbs */
        .ambient-light {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw;
            height: 100vh;
            z-index: 3;
            pointer-events: none;
            overflow: hidden;
            mix-blend-mode: screen;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.35;
            animation: float 22s infinite ease-in-out alternate;
        }

        .orb-1 {
            width: 55vw;
            height: 55vw;
            background: var(--secondary-color);
            top: -15%;
            left: -15%;
        }

        .orb-2 {
            width: 45vw;
            height: 45vw;
            background: #8b1e3f;
            bottom: -15%;
            right: -15%;
            animation-delay: -6s;
        }

        .orb-3 {
            width: 35vw;
            height: 35vw;
            background: #b5179e;
            top: 40%;
            left: 60%;
            opacity: 0.2;
            animation-delay: -12s;
        }

        @keyframes float {
            0% { transform: translateY(0) scale(1) rotate(0deg); }
            100% { transform: translateY(60px) scale(1.12) rotate(15deg); }
        }

        /* Main Container */
        #app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        /* Section Pill Badge */
        .section-badge {
            font-family: 'Outfit', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--gold-accent);
            background: rgba(255, 209, 102, 0.15);
            border: 1px solid rgba(255, 209, 102, 0.35);
            padding: 6px 16px;
            border-radius: 50px;
            margin-bottom: 24px;
            backdrop-filter: blur(8px);
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.6s ease;
        }

        .section-badge.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Lyrics Container */
        .lyrics-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            height: 380px;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
        }

        .lyrics-line {
            position: absolute;
            width: 100%;
            text-align: center;
            opacity: 0;
            transform: translateY(40px) scale(0.92);
            transition: opacity 0.9s cubic-bezier(0.2, 0.8, 0.2, 1),
                        transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1),
                        filter 0.9s ease;
            filter: blur(12px);
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
        }

        .lyrics-line.active {
            opacity: 1;
            transform: translateY(0) scale(1);
            filter: blur(0);
            z-index: 2;
        }

        .lyrics-line.exit {
            opacity: 0;
            transform: translateY(-40px) scale(1.06);
            filter: blur(8px);
        }

        .lyrics-text {
            font-family: 'Playfair Display', serif;
            font-size: 2.6rem;
            line-height: 1.35;
            margin-bottom: 1rem;
            color: #ffffff;

            flex-wrap: wrap;
            justify-content: center;
            gap: 10px 14px;
            transition: transform 0.1s ease-out, text-shadow 0.1s ease-out;

        .lyrics-word {
            display: inline-block;
            opacity: 0;
            transform: translateY(22px) scale(0.85);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);

</head>

    <script>
        // Particle System Setup
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let particlesArray = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 50;
                this.size = Math.random() * 3 + 1;
                this.speedY = -(Math.random() * 0.9 + 0.3);
                this.speedX = (Math.random() - 0.5) * 0.6;
                this.alpha = Math.random() * 0.6 + 0.2;
                this.hue = Math.random() > 0.4 ? '255, 51, 102' : '255, 209, 102'; // Pink & Gold fireflies
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                if (this.y < -10 || this.x < -10 || this.x > canvas.width + 10) {
                    this.reset();
                }
            }
            draw() {
                ctx.save();
                ctx.fillStyle = `rgba(${this.hue}, ${this.alpha})`;
                ctx.shadowBlur = 8;
                ctx.shadowColor = `rgba(${this.hue}, 0.8)`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function initParticles() {
            particlesArray = [];
            const count = Math.floor((canvas.width * canvas.height) / 12000) + 20;
            for (let i = 0; i < count; i++) {
                const p = new Particle();
                p.y = Math.random() * canvas.height;
                particlesArray.push(p);
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            requestAnimationFrame(animateParticles);
        }
        initParticles();

                el.classList.add('lyrics-line');
                
                let formattedText = '';
                if (line.text.includes('<div')) {
                    formattedText = line.text;
                } else {
                    const words = line.text.split(' ');
                    formattedText = words.map((word, i) => 
                        `<span class="lyrics-word" style="transition-delay: ${i * 0.12}s">${word}</span>`
                    ).join('');
                }

                el.innerHTML = `<div class="lyrics-text" id="text-container-${index}">${formattedText}</div>`;
                el.id = `line-${index}`;
                lyricsWrapper.appendChild(el);

                // Background image element
                const imgEl = document.createElement('img');
                imgEl.src = `dil_ka_images/${line.image}`;
                imgEl.classList.add('bg-image');
                imgEl.id = `bg-${index}`;
                
                // Fallback handling
                imgEl.onerror = function() {
                    this.src = 'dil_ka_images/img_01.jpg';
                };

                bgImageContainer.appendChild(imgEl);
            });

            function formatTime(seconds) {
                if (isNaN(seconds) || seconds < 0) return "00:00";
                const min = Math.floor(seconds / 60);
                const sec = Math.floor(seconds % 60);
                return `${min < 10 ? '0' + min : min}:${sec < 10 ? '0' + sec : sec}`;
            }

            // Update UI on time update
            function updateLyrics(currentTime) {
                let activeIdx = -1;
                for (let i = 0; i < lyrics.length; i++) {
                    if (currentTime >= lyrics[i].time) {
                        activeIdx = i;
                    } else {
                        break;
                    }
                }

                if (activeIdx !== currentIndex) {
                    if (currentIndex !== -1) {
                        const prevEl = document.getElementById(`line-${currentIndex}`);
                        if (prevEl) {
                            prevEl.classList.remove('active');
                            prevEl.classList.add('exit');
                        }
                        const prevImg = document.getElementById(`bg-${currentIndex}`);
                        if (prevImg) {
                            prevImg.classList.remove('active');
                        }
                    }

                    if (activeIdx !== -1) {
                        const nextEl = document.getElementById(`line-${activeIdx}`);
                        if (nextEl) {
                            nextEl.classList.remove('exit');
                            nextEl.classList.add('active');
                        }
                        const nextImg = document.getElementById(`bg-${activeIdx}`);
                        if (nextImg) {
                            nextImg.classList.add('active');
                        }
                        // Update section badge
                        if (lyrics[activeIdx].section) {
                            sectionBadge.textContent = lyrics[activeIdx].section;
                            sectionBadge.classList.add('visible');
                        }
                    }

                    currentIndex = activeIdx;
                }
            }

            audio.addEventListener('timeupdate', () => {
                const cur = audio.currentTime;
                const dur = audio.duration || 161.5;

                updateLyrics(cur);

                const progress = (cur / dur) * 100;
                progressBar.style.width = `${progress}%`;
                currentTimeEl.textContent = formatTime(cur);
                totalTimeEl.textContent = formatTime(dur);
            });

            // Seek functionality
            progressContainer.addEventListener('click', (e) => {
                const rect = progressContainer.getBoundingClientRect();
                const pos = (e.clientX - rect.left) / rect.width;
                const dur = audio.duration || 161.5;
                audio.currentTime = pos * dur;
            });

            // Play / Pause Toggle
            function togglePlay() {
                if (audio.paused) {
                    audio.play();
                    playPauseBtn.textContent = '⏸';
                } else {
                    audio.pause();
                    playPauseBtn.textContent = '▶';
                }
            }
            playPauseBtn.addEventListener('click', togglePlay);

            // Rewind / Forward 10s
            rewindBtn.addEventListener('click', () => {
                audio.currentTime = Math.max(0, audio.currentTime - 10);
            });
            forwardBtn.addEventListener('click', () => {
                const dur = audio.duration || 161.5;
                audio.currentTime = Math.min(dur, audio.currentTime + 10);
            });

            // Keyboard shortcut (Spacebar)
            window.addEventListener('keydown', (e) => {
                if (e.code === 'Space') {
                    e.preventDefault();
                    togglePlay();
                } else if (e.code === 'ArrowLeft') {
                    audio.currentTime = Math.max(0, audio.currentTime - 5);
                } else if (e.code === 'ArrowRight') {
                    const dur = audio.duration || 161.5;
                    audio.currentTime = Math.min(dur, audio.currentTime + 5);
                }
            });

            // Web Audio API for dynamic Audio-Reactive Glowing Typography
            let audioCtx, analyser, dataArray;
            let audioReactiveEnabled = false;

            startBtn.addEventListener('click', () => {
                if (!audioCtx) {
                    try {
                        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                        const audioSrc = audioCtx.createMediaElementSource(audio);
                        analyser = audioCtx.createAnalyser();
                        audioSrc.connect(analyser);
                        analyser.connect(audioCtx.destination);
                        analyser.fftSize = 256;
                        const bufferLength = analyser.frequencyBinCount;
                        dataArray = new Uint8Array(bufferLength);
                        audioReactiveEnabled = true;
                    } catch (err) {
                        console.warn('AudioContext not supported or restricted:', err);
                    }
                }

                audio.play().then(() => {
                    overlay.style.opacity = 0;
                    setTimeout(() => overlay.style.display = 'none', 800);
                    playPauseBtn.textContent = '⏸';
                }).catch(e => {
                    console.error("Audio playback error:", e);
                    alert("Please click or interact with the page to allow audio playback.");
                });
            });

            // Audio reactive rendering loop
            function audioLoop() {
                if (audioReactiveEnabled && currentIndex !== -1 && !audio.paused) {
                    analyser.getByteFrequencyData(dataArray);
                    
                    // Bass & lower midrange average (first 28 bins)
                    let sum = 0;
                    for (let i = 0; i < 28; i++) {
                        sum += dataArray[i];
                    }
                    const average = sum / 28;
                    
                    const scale = 1 + (average / 255) * 0.18; // Max scale 1.18
                    const glow = (average / 255) * 45; // Max glow 45px

                    const activeTextContainer = document.getElementById(`text-container-${currentIndex}`);
                    if (activeTextContainer) {
                        activeTextContainer.style.transform = `scale(${scale})`;
                        activeTextContainer.style.textShadow = `0 0 ${glow + 10}px rgba(255, 51, 102, 0.9), 0 0 ${(glow/2) + 15}px rgba(255, 204, 213, 0.7)`;
                    }
                }
                requestAnimationFrame(audioLoop);
            }
            audioLoop();
        });
    </script>
</body>
